[project]
name = "poludzku-core"
version = "0.1.0"
description = "Deterministyczny silnik Po ludzku. Bez sieci."
requires-python = ">=3.12"
dependencies = ["pypdf>=5,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
