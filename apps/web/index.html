<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'; script-src 'self'">
  <title>Po ludzku</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 18px/1.45 Georgia, "Iowan Old Style", serif; background: #f4f0e6; color: #1c1915; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 0.4rem; }
    p, li { margin: 0.4rem 0; }
    .warn { background: #fff; border-left: 4px solid #8a3b12; padding: 0.8rem 1rem; }
    textarea, input { width: 100%; box-sizing: border-box; font: 16px/1.4 ui-monospace, monospace; padding: 0.7rem; border: 1px solid #1c1915; background: #fff; }
    textarea { min-height: 12rem; }
    button { font: 16px/1.2 system-ui, sans-serif; padding: 0.8rem 1rem; margin: 0.4rem 0.4rem 0.4rem 0; background: #1c1915; color: #f4f0e6; border: 0; }
    button.quiet { background: transparent; color: #1c1915; border: 1px solid #1c1915; }
    pre { white-space: pre-wrap; font: 16px/1.4 ui-monospace, monospace; background: #fff; padding: 1rem; border: 1px solid #1c1915; }
    .ad { margin-top: 2rem; padding-top: 1rem; border-top: 1px dashed #8a3b12; }
    footer { margin-top: 2rem; font: 14px/1.4 system-ui, sans-serif; color: #3f3a34; }
    label { display: block; margin-top: 0.8rem; font: 15px/1.3 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Po ludzku</h1>
    <p class="warn">Tekst zostaje w tej karcie przeglądarki. Nie wysyłamy go. To automat, może się mylić. To nie jest pomoc prawna.</p>
    <label for="letter">Wklej tekst pisma</label>
    <textarea id="letter" autocomplete="off" spellcheck="false"></textarea>
    <label for="delivery">Data doręczenia, jeśli ją znasz (RRRR-MM-DD). Nie bierz jej z domysłu.</label>
    <input id="delivery" inputmode="numeric" placeholder="2026-03-10" autocomplete="off">
    <p><button id="go" type="button">Pokaż kartkę</button></p>
    <pre id="out" hidden></pre>
    <p><button id="copy" class="quiet" type="button" hidden>Kopiuj kartkę dla rodziny</button></p>
    <section class="ad" aria-label="Informacja handlowa">
      <pre id="ad"></pre>
    </section>
    <footer id="who"></footer>
  </main>
  <script type="module" src="./page.mjs"></script>
</body>
</html>
