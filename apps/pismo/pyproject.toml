[project]
name = "poludzku-pismo"
version = "0.1.0"
description = "CLI i lokalny podgląd Po ludzku."
requires-python = ">=3.12"
dependencies = ["poludzku-core"]

[project.scripts]
pismo = "poludzku_pismo.cli:main"

[tool.uv.sources]
poludzku-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poludzku_pismo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
